openapi: 3.1.0
info:
  title: threat-forge API
  version: 0.1.0
  description: Governed read-only API contract for the current threat-forge application surface.
servers:
  - url: /
paths:
  /api/project-model/documentation:
    get:
      operationId: listProjectDocumentation
      summary: List governed Project Documentation Explorer items.
      description: Returns a frontend-safe read-only collection view-model with backend-derived filter facets.
      tags:
        - ProjectDocumentationExplorer
      parameters:
        - $ref: '#/components/parameters/MacroRequirementFilter'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/RequirementTypeFilter'
        - $ref: '#/components/parameters/ImplementationStateFilter'
        - $ref: '#/components/parameters/AcceptanceStateFilter'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: Filtered documentation collection view-model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationExplorerViewModel'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/project-model/documentation/filters:
    get:
      operationId: listProjectDocumentationFilters
      summary: List Project Documentation Explorer filter facets.
      description: Returns available backend-derived filter facets for the current query and access decision.
      tags:
        - ProjectDocumentationExplorer
      parameters:
        - $ref: '#/components/parameters/MacroRequirementFilter'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/RequirementTypeFilter'
        - $ref: '#/components/parameters/ImplementationStateFilter'
        - $ref: '#/components/parameters/AcceptanceStateFilter'
        - $ref: '#/components/parameters/SearchFilter'
      responses:
        '200':
          description: Filter facet view-model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationFiltersViewModel'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/project-model/documentation/entities/{id}:
    get:
      operationId: getProjectDocumentationEntity
      summary: Get a Project Documentation Explorer entity detail.
      description: Returns registry metadata, graph relations and backend-resolved governed Markdown body content for one entity.
      tags:
        - ProjectDocumentationExplorer
      parameters:
        - name: id
          in: path
          required: true
          description: Governed entity identifier returned by the collection endpoint.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Documentation entity detail view-model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationDetailViewModel'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/child-projects:
    get:
      operationId: listChildProjects
      summary: List managed child projects.
      description: Returns operational lifecycle state for child projects managed by the platform.
      tags:
        - ChildProjectManagement
      responses:
        '200':
          description: Child project operational state list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProjectOperationalStateList'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/child-projects/{id}:
    get:
      operationId: getChildProject
      summary: Get one managed child project.
      description: Returns operational lifecycle state for one child project managed by the platform.
      tags:
        - ChildProjectManagement
      parameters:
        - name: id
          in: path
          required: true
          description: Managed child project identifier.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Child project operational state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProjectOperationalState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/child-project-governance/gate-plans:
    get:
      operationId: listChildProjectGovernanceGatePlans
      summary: List generated child project governance gate plan artifacts.
      description: Returns UI-safe summaries of generated gate plan artifacts for platform and child project governance profiles.
      tags:
        - ChildProjectGovernancePlan
      responses:
        '200':
          description: Available child project governance gate plan artifacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProjectGovernanceGatePlanList'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/child-project-governance/gate-plans/{profile}/{target_scope}:
    get:
      operationId: getChildProjectGovernanceGatePlan
      summary: Get one generated child project governance gate plan artifact.
      description: Returns one generated gate plan artifact with study-oriented concept explanations and gate-selection rationale without executing gates or mutating child projects.
      tags:
        - ChildProjectGovernancePlan
      parameters:
        - $ref: '#/components/parameters/GovernanceProfilePath'
        - $ref: '#/components/parameters/GovernanceTargetScopePath'
      responses:
        '200':
          description: Child project governance gate plan artifact detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProjectGovernanceGatePlanDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    GovernanceProfilePath:
      name: profile
      in: path
      required: true
      description: Governance profile id used in the generated gate plan artifact file name.
      schema:
        type: string
        minLength: 1
    GovernanceTargetScopePath:
      name: target_scope
      in: path
      required: true
      description: Target scope id used in the generated gate plan artifact file name.
      schema:
        type: string
        minLength: 1
    MacroRequirementFilter:
      name: mr
      in: query
      required: false
      description: Comma-separated macro requirement identifiers such as MR-0002.
      schema:
        type: array
        items:
          type: string
          minLength: 1
      style: form
      explode: false
    KindFilter:
      name: kind
      in: query
      required: false
      description: Comma-separated governed entity kinds.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EntityKind'
      style: form
      explode: false
    StatusFilter:
      name: status
      in: query
      required: false
      description: Comma-separated registry status values.
      schema:
        type: array
        items:
          type: string
          minLength: 1
      style: form
      explode: false
    RequirementTypeFilter:
      name: requirement_type
      in: query
      required: false
      description: Comma-separated requirement type values.
      schema:
        type: array
        items:
          type: string
          minLength: 1
      style: form
      explode: false
    ImplementationStateFilter:
      name: implementation_state
      in: query
      required: false
      description: Comma-separated implementation state values.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ImplementationState'
      style: form
      explode: false
    AcceptanceStateFilter:
      name: acceptance_state
      in: query
      required: false
      description: Comma-separated acceptance state values.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AcceptanceState'
      style: form
      explode: false
    SearchFilter:
      name: q
      in: query
      required: false
      description: Free-text search query applied by the backend service.
      schema:
        type: string
  responses:
    Forbidden:
      description: The current principal lacks the required capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested governed entity was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EntityKind:
      type: string
      enum:
        - macro_requirement
        - requirement
        - adr
        - taxonomy
        - graph_node
        - document
    ImplementationState:
      type: string
      enum:
        - implemented
        - partially_implemented
        - not_implemented
        - not_applicable
        - unknown
    AcceptanceState:
      type: string
      enum:
        - accepted
        - not_accepted
        - not_applicable
        - unknown
    SourceReference:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - registry
            - body
            - graph
            - taxonomy
            - derived
        path:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
      required:
        - kind
    AccessDecision:
      type: object
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          minLength: 1
        allowed:
          type: boolean
        required_capability:
          type: string
          minLength: 1
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
      required:
        - authenticated
        - allowed
        - required_capability
        - capabilities
    DocumentationQuery:
      type: object
      additionalProperties: false
      properties:
        mr:
          type: array
          items:
            type: string
            minLength: 1
        kind:
          type: array
          items:
            $ref: '#/components/schemas/EntityKind'
        status:
          type: array
          items:
            type: string
            minLength: 1
        requirement_type:
          type: array
          items:
            type: string
            minLength: 1
        implementation_state:
          type: array
          items:
            $ref: '#/components/schemas/ImplementationState'
        acceptance_state:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceState'
        q:
          type: string
      required:
        - mr
        - kind
        - status
        - requirement_type
        - implementation_state
        - acceptance_state
        - q
    FilterValue:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 0
        description:
          type: string
        selected:
          type: boolean
      required:
        - value
        - label
        - count
        - selected
    FilterFacet:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          enum:
            - mr
            - kind
            - status
            - requirement_type
            - implementation_state
            - acceptance_state
        label:
          type: string
          minLength: 1
        source:
          type: string
          enum:
            - registry
            - graph
            - derived
            - policy
        values:
          type: array
          items:
            $ref: '#/components/schemas/FilterValue'
      required:
        - id
        - label
        - source
        - values
    DocumentationItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        local_id:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/EntityKind'
        title:
          type: string
          minLength: 1
        taxonomy_group_id:
          type: string
          minLength: 1
        taxonomy_value_count:
          type: integer
          minimum: 0
        macro_requirement_id:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        requirement_type:
          type: string
          minLength: 1
        decision_type:
          type: string
          minLength: 1
        priority:
          type: string
          minLength: 1
        implementation_state:
          $ref: '#/components/schemas/ImplementationState'
        acceptance_state:
          $ref: '#/components/schemas/AcceptanceState'
        related_requirement_ids:
          type: array
          items:
            type: string
            minLength: 1
        related_adr_ids:
          type: array
          items:
            type: string
            minLength: 1
        source_references:
          type: array
          items:
            $ref: '#/components/schemas/SourceReference'
      required:
        - id
        - kind
        - title
        - implementation_state
        - acceptance_state
        - related_requirement_ids
        - related_adr_ids
        - source_references
    TaxonomyValueExplanation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        function:
          type: string
          minLength: 1
        ui:
          type: object
          additionalProperties: true
        security_analysis:
          type: object
          additionalProperties: true
      required:
        - id
        - label
    TaxonomyFieldValueExplanation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        function:
          type: string
          minLength: 1
        current:
          type: boolean
        ui:
          type: object
          additionalProperties: true
        security_analysis:
          type: object
          additionalProperties: true
      required:
        - id
        - label
        - current
    TaxonomyFieldExplanation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        current_value:
          oneOf:
            - $ref: '#/components/schemas/TaxonomyFieldValueExplanation'
            - type: 'null'
        allowed_values:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyFieldValueExplanation'
        source:
          type: string
          enum: [contract, registry, derived, observed]
        source_taxonomy:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
      required:
        - field
        - label
        - current_value
        - allowed_values
        - source
    TaxonomyDetailViewModel:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        source_path:
          type: string
          minLength: 1
        value_count:
          type: integer
          minimum: 0
        values:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyValueExplanation'
      required:
        - id
        - title
        - value_count
        - values
    DocumentationBodyViewModel:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          const: markdown
        path:
          type: string
          minLength: 1
        content_markdown:
          type: string
        available:
          type: boolean
        missing_reason:
          type: string
          minLength: 1
      required:
        - format
        - path
        - content_markdown
        - available
    DocumentationSummary:
      type: object
      additionalProperties: false
      properties:
        total_items:
          type: integer
          minimum: 0
        filtered_items:
          type: integer
          minimum: 0
        counts_by_kind:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
        - total_items
        - filtered_items
        - counts_by_kind
    GraphRelation:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
        predicate:
          type: string
          minLength: 1
        object:
          type: string
          minLength: 1
      required:
        - subject
        - predicate
        - object
    DocumentationExplorerViewModel:
      type: object
      additionalProperties: false
      properties:
        access:
          $ref: '#/components/schemas/AccessDecision'
        query:
          $ref: '#/components/schemas/DocumentationQuery'
        summary:
          $ref: '#/components/schemas/DocumentationSummary'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterFacet'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentationItem'
      required:
        - access
        - query
        - summary
        - filters
        - items
    DocumentationFiltersViewModel:
      type: object
      additionalProperties: false
      properties:
        access:
          $ref: '#/components/schemas/AccessDecision'
        query:
          $ref: '#/components/schemas/DocumentationQuery'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterFacet'
      required:
        - access
        - query
        - filters
    DocumentationDetailViewModel:
      type: object
      additionalProperties: false
      properties:
        access:
          $ref: '#/components/schemas/AccessDecision'
        item:
          $ref: '#/components/schemas/DocumentationItem'
        incoming_relations:
          type: array
          items:
            $ref: '#/components/schemas/GraphRelation'
        outgoing_relations:
          type: array
          items:
            $ref: '#/components/schemas/GraphRelation'
        taxonomy:
          oneOf:
            - $ref: '#/components/schemas/TaxonomyDetailViewModel'
            - type: 'null'
        taxonomy_fields:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyFieldExplanation'
        body:
          oneOf:
            - $ref: '#/components/schemas/DocumentationBodyViewModel'
            - type: 'null'
      required:
        - access
        - item
        - incoming_relations
        - outgoing_relations
        - taxonomy
        - taxonomy_fields
        - body
    ChildProjectRepositoryLocation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - git
            - local
        url:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        local_path:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        default_branch:
          type: string
          minLength: 1
      required:
        - kind
        - url
        - local_path
        - default_branch
    ChildProjectModelProfile:
      type: object
      additionalProperties: false
      properties:
        root:
          type: string
          minLength: 1
        governance_profile:
          type: string
          minLength: 1
      required:
        - root
        - governance_profile
    ChildProjectLifecyclePolicy:
      type: object
      additionalProperties: false
      properties:
        document_first_required:
          type: boolean
        code_traceability_required:
          type: boolean
        threat_analysis_pre_code_required:
          type: string
          enum:
            - reserved
            - required
            - disabled
        governed_commit_push_required:
          type: boolean
        direct_push_allowed:
          type: boolean
      required:
        - document_first_required
        - code_traceability_required
        - threat_analysis_pre_code_required
        - governed_commit_push_required
        - direct_push_allowed
    ChildProjectRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        repository:
          $ref: '#/components/schemas/ChildProjectRepositoryLocation'
        project_model:
          $ref: '#/components/schemas/ChildProjectModelProfile'
        lifecycle_policy:
          $ref: '#/components/schemas/ChildProjectLifecyclePolicy'
        archived:
          type: boolean
        created_at:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        updated_at:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
      required:
        - id
        - name
        - repository
        - project_model
        - lifecycle_policy
        - archived
        - created_at
        - updated_at
    ChildProjectGateResult:
      type: object
      additionalProperties: false
      properties:
        gate_name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - pass
            - fail
            - warning
            - skipped
            - reserved
            - unknown
        summary:
          type: string
      required:
        - gate_name
        - status
        - summary
    ChildProjectViolation:
      type: object
      additionalProperties: false
      properties:
        gate_name:
          type: string
          minLength: 1
        severity:
          type: string
          enum:
            - blocking
            - warning
            - info
        code:
          type: string
          minLength: 1
        path:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        message:
          type: string
          minLength: 1
      required:
        - gate_name
        - severity
        - code
        - path
        - message
    ChildProjectCheckRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        child_project_id:
          type: string
          minLength: 1
        checked_at:
          type: string
          minLength: 1
        repository_head:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        branch:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        overall_status:
          type: string
          enum:
            - pass
            - fail
            - warning
            - skipped
            - reserved
            - unknown
        gate_results:
          type: array
          items:
            $ref: '#/components/schemas/ChildProjectGateResult'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ChildProjectViolation'
      required:
        - id
        - child_project_id
        - checked_at
        - repository_head
        - branch
        - overall_status
        - gate_results
        - violations
    ChildProjectOperationalState:
      type: object
      additionalProperties: false
      properties:
        child_project:
          $ref: '#/components/schemas/ChildProjectRecord'
        latest_check_run:
          oneOf:
            - $ref: '#/components/schemas/ChildProjectCheckRun'
            - type: 'null'
      required:
        - child_project
        - latest_check_run
    ChildProjectOperationalStateList:
      type: object
      additionalProperties: false
      properties:
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChildProjectOperationalState'
      required:
        - capabilities
        - items
    ChildProjectGovernanceGatePlanSummary:
      type: object
      required:
        - profile
        - target_scope
        - result
        - gates_evaluated
        - artifact_path
      properties:
        profile:
          type: string
        target_scope:
          type: string
        result:
          type: string
        gates_evaluated:
          type: integer
          minimum: 0
        summary:
          type: object
          additionalProperties:
            type: integer
        artifact_path:
          type: string
    ChildProjectGovernanceGatePlanList:
      type: object
      required:
        - access
        - artifact_directory
        - items
      properties:
        access:
          $ref: '#/components/schemas/AccessDecision'
        artifact_directory:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChildProjectGovernanceGatePlanSummary'
    ChildProjectGovernanceGatePlanGate:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        label:
          type: string
        applicability_class:
          type: string
        status:
          type: string
        severity:
          type: string
        reason:
          type: string
        required_capabilities:
          type: array
          items:
            type: string
        validation_surfaces:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            type: string
        expected_verification_output:
          type: string
        technical_trace:
          type: object
          additionalProperties: true
    ChildProjectGovernanceGatePlan:
      type: object
      required:
        - profile
        - target_scope
        - result
        - gates_evaluated
        - gates
      properties:
        profile:
          type: string
        target_scope:
          type: string
        result:
          type: string
        summary:
          type: object
          additionalProperties:
            type: integer
        gates_evaluated:
          type: integer
          minimum: 0
        capability_states:
          type: object
          additionalProperties:
            type: string
        gates:
          type: array
          items:
            $ref: '#/components/schemas/ChildProjectGovernanceGatePlanGate'
    ChildProjectGovernanceGatePlanArtifact:
      type: object
      required:
        - schema_version
        - artifact_type
        - plan
      properties:
        schema_version:
          type: integer
        artifact_type:
          type: string
          const: child_project_governance_gate_plan
        generated_by:
          type: string
        implements_requirements:
          type: array
          items:
            type: string
        registry_directory:
          type: string
        plan:
          $ref: '#/components/schemas/ChildProjectGovernanceGatePlan'
    ChildProjectGovernanceConceptExplanation:
      type: object
      description: Study-oriented explanation for a governed child-project governance concept or registry value.
      additionalProperties: true
      required:
        - id
        - label
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        description:
          type: string
        concept:
          type: string
        why_it_matters:
          type: string
        source_registry:
          type: string
        enables:
