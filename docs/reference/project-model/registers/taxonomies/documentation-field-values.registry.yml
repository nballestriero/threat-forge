schema_version: 2
registry_id: documentation-field-values-taxonomy
scope: governed_documentation_fields
status: draft

field_value_sets:
  - id: FIELD-VALUE-SET-0001
    name: field_value_set_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/taxonomies/documentation-field-values.registry.yml
    applies_to_record: registry_root_and_field_value_sets
    status: draft
    description: Lifecycle values for the documentation field value registry itself and for value set definitions declared inside it.
    values:
      - value: draft
        meaning: The registry or value set is under review and can change before it is treated as stable.
      - value: active
        meaning: The registry or value set is valid for current deterministic checks.
      - value: deprecated
        meaning: The registry or value set is retained for history but should not be used for new records.
      - value: superseded
        meaning: The registry or value set has been replaced by a newer governed value set.

  - id: FIELD-VALUE-SET-0002
    name: vocabulary_registry_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/vocabularies/documentation-terms.registry.yml
    applies_to_record: registry_root
    status: draft
    description: Lifecycle values for the controlled vocabulary registry as a whole.
    values:
      - value: draft
        meaning: The vocabulary registry is under review and can change before becoming stable.
      - value: active
        meaning: The vocabulary registry is the current source for controlled terminology.
      - value: deprecated
        meaning: The vocabulary registry is retained for history but should not be used for new terminology decisions.
      - value: superseded
        meaning: The vocabulary registry has been replaced by a newer governed vocabulary registry.

  - id: FIELD-VALUE-SET-0003
    name: vocabulary_term_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/vocabularies/documentation-terms.registry.yml
    applies_to_record: terms
    status: draft
    description: Lifecycle values for individual terms in the controlled documentation vocabulary.
    values:
      - value: draft
        meaning: The term is under review and can change before it becomes canonical.
      - value: active
        meaning: The term is valid for current governed documentation.
      - value: candidate
        meaning: The term is proposed but not yet accepted for normative use.
      - value: deprecated
        meaning: The term is retained for history but should not be used in new governed documentation.
      - value: forbidden
        meaning: The term is explicitly not allowed as a governed documentation concept.

  - id: FIELD-VALUE-SET-0004
    name: vocabulary_label_role
    field_name: role
    applies_to_registry: docs/reference/project-model/registers/vocabularies/documentation-terms.registry.yml
    applies_to_record: terms.labels
    status: draft
    description: Controlled roles used by labels in the documentation terms vocabulary.
    values:
      - value: preferred
        meaning: Preferred label for governed documentation.
      - value: accepted_alias
        meaning: Accepted alias with explicit reason, such as a technical acronym or historical compatibility.
      - value: translation
        meaning: Readable translation that does not create a second canonical source.
      - value: forbidden
        meaning: Label or phrase that should be flagged by terminology checks.
      - value: candidate
        meaning: Proposed label not yet accepted for normative use.
      - value: historical
        meaning: Historical label recognized for migration or legacy reading, not preferred for new content.

  - id: FIELD-VALUE-SET-0005
    name: check_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/checks/local-governance-checks.registry.yml
    applies_to_record: checks
    status: draft
    description: Execution lifecycle values for checks declared in the local governance check registry.
    values:
      - value: active
        meaning: The check is executed by the local repository check orchestrator and can fail the local check run.
      - value: disabled
        meaning: The check is registered but intentionally not executed.
      - value: experimental
        meaning: The check is visible and may be run manually, but should not yet fail the local gate.
      - value: deprecated
        meaning: The check remains registered for traceability but should no longer be used.

  - id: FIELD-VALUE-SET-0006
    name: implementation_artifact_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/implementation/implementation-trace.registry.yml
    applies_to_record: artifacts
    status: draft
    description: Lifecycle values for implementation artifacts declared in the implementation trace registry.
    values:
      - value: planned
        meaning: The artifact is expected but does not have to exist yet; missing files can produce warnings.
      - value: scaffolded
        meaning: The artifact file and trace record exist, but the governed implementation behavior is still incomplete and must not be treated as implemented.
      - value: implemented
        meaning: The artifact exists and is expected to declare traceability to governed requirements.
      - value: deprecated
        meaning: The artifact still exists for compatibility or history but should not be used for new work.
      - value: removed
        meaning: The artifact is no longer present and the record is retained only for historical traceability.

  - id: FIELD-VALUE-SET-0007
    name: decision_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/decisions/MR-*.decisions.registry.yml
    applies_to_record: decisions
    status: draft
    description: Lifecycle values for decision records in the governed documentation model.
    values:
      - value: draft
        meaning: The decision is under review and can still change.
      - value: accepted
        meaning: The decision is valid and applies to current governed documentation.
      - value: superseded
        meaning: The decision has been replaced by a later governed decision.
      - value: deprecated
        meaning: The decision is retained for history but should not guide new work.
      - value: rejected
        meaning: The decision record documents an option that was explicitly not adopted.

  - id: FIELD-VALUE-SET-0008
    name: requirement_lifecycle_status
    field_name: status
    applies_to_registry: docs/reference/project-model/registers/requirements/MR-*.requirements.registry.yml
    applies_to_record: requirements
    status: draft
    description: Lifecycle values for requirement records, separate from implementation state derived from traceability.
    values:
      - value: draft
        meaning: The requirement is under review and can still change.
      - value: accepted
        meaning: The requirement is valid and applies to current governed documentation.
      - value: superseded
        meaning: The requirement has been replaced by a newer governed requirement.
      - value: deprecated
        meaning: The requirement is retained for history but should not guide new work.
      - value: removed
        meaning: The requirement is no longer part of the active model and is retained only for traceability.

  - id: FIELD-VALUE-SET-0009
    name: execution_result_status
    field_name: result_status
    applies_to_registry: artifacts/**
    applies_to_record: check_reports
    status: draft
    description: Runtime result values for generated reports; these values are derived execution outcomes, not lifecycle values for governed records.
    values:
      - value: pass
        meaning: The check completed successfully without blocking errors.
      - value: warning
        meaning: The check found a non-blocking condition that should be reviewed.
      - value: fail
        meaning: The check found a governed rule violation.
      - value: error
        meaning: The check could not complete correctly because of an operational or parsing problem.
      - value: skipped
        meaning: The check was intentionally not executed in the current run.
