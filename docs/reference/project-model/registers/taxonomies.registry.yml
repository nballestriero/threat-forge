schema_version: 1
registry_id: taxonomies-registry
project: threat-forge

taxonomies:
  requirement_type:
    - id: functional
      function: Describes what the system must do.
      description: A base requirement that can belong directly to a macro requirement.

    - id: security-control
      function: Adds security constraints or mitigations to a functional requirement.
      description: A specialized child requirement that must point to a parent functional requirement.

    - id: governance-control
      function: Defines governance or documentation control behavior.
      description: A specialized child requirement that constrains or controls project governance.

    - id: schema
      function: Defines required data shape, fields, and validation rules.
      description: A requirement about JSON/YAML/Markdown schema structure.

    - id: tooling
      function: Defines behavior of tools, commands, validators, or generated pages.
      description: A requirement implemented by deterministic project tooling.

    - id: verification
      function: Defines evidence, tests, checks, or negative fixtures.
      description: A requirement about proving that another requirement is satisfied.

    - id: quality
      function: Defines non-functional quality constraints.
      description: A requirement about maintainability, robustness, readability, or reliability.

  requirement_relation_type:
    - id: REFINES
      function: Details a more general parent requirement.
      description: Child requirement narrows or clarifies a parent requirement.

    - id: HARDENS
      function: Adds security or governance hardening to a parent requirement.
      description: Child requirement strengthens a base requirement.

    - id: CONSTRAINS
      function: Limits what is allowed by a parent requirement.
      description: Child requirement adds boundaries or restrictions.

    - id: MITIGATES
      function: Reduces a risk or failure mode related to a parent requirement.
      description: Child requirement introduces mitigation behavior.

    - id: IMPLEMENTS_CONTROL_FOR
      function: Implements a control that supports a parent requirement.
      description: Child requirement provides a control mechanism for a parent requirement.

  node_type:
    - id: MacroRequirement
      function: Represents a governed top-level functional macro requirement.
      description: Macro requirement node derived from the macro-requirements registry.

    - id: ADR
      function: Represents an architecture decision record.
      description: Governed decision record stored in the decision registry and described by a body document.

    - id: Document
      function: Represents a governed project document.
      description: File-backed document node used as a graph object for body, detail, reference, or evidence files.

    - id: Requirement
      function: Represents a governed requirement.
      description: Requirement node derived from compact requirement records.

  spo_predicate:
    - id: described_by
      function: Links a governed model entity to the document that contains its body.
      forward_label: described by
      inverse_label: describes
      subject_type: GovernedEntity
      object_type: Document
      description: The subject entity is described by the object document.

    - id: implements
      function: Links a governed requirement to the macro requirement it implements.
      forward_label: implements
      inverse_label: implemented by
      subject_type: Requirement
      object_type: MacroRequirement
      description: The subject requirement contributes to or implements the target macro requirement.

    - id: specified_by
      function: Links a governed requirement to the ADR that specifies it.
      forward_label: specified by
      inverse_label: specifies
      subject_type: Requirement
      object_type: ADR
      description: The subject requirement is specified by the object architecture decision record.

    - id: implemented_by
      function: Links a requirement to source files, commands, tools, or hooks.
      forward_label: implemented by
      inverse_label: implements
      subject_type: Requirement
      object_type: ImplementationArtifact
      description: Requirement is implemented by a concrete project artifact.

    - id: verifies
      function: Links checks, tests, commands, or fixtures to the requirement they verify.
      forward_label: verifies
      inverse_label: verified by
      subject_type: VerificationArtifact
      object_type: Requirement
      description: Verification artifact proves or checks a requirement.

    - id: requires_component
      function: Links a requirement to an architectural component.
      forward_label: requires component
      inverse_label: required by
      subject_type: Requirement
      object_type: Component
      description: Requirement depends on a component existing or behaving in a defined way.

    - id: justifies
      function: Links a decision to the requirement it justifies.
      forward_label: justifies
      inverse_label: justified by
      subject_type: ADR
      object_type: Requirement
      description: Decision provides rationale for a requirement.
