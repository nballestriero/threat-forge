schema_version: 1
model_id: governance-requirement
title: Governance Requirement
description: Deterministic governance obligation attached to one Functional Requirement and represented by one Requirement registry record and one Markdown body.
registry_profile_id: requirement-registry
body_profile_id: governance-requirement-body

identity:
  registry_id_member_id: governance-requirement.registry.record.id
  body_id_member_id: governance-requirement.body.header.id
  registry_title_member_id: governance-requirement.registry.record.title
  body_title_member_id: governance-requirement.body.header.title

coherence_rules:
  - id: governance-requirement.model.header.identity
    kind: mirrored_identity
    source_member_id: governance-requirement.registry.record.id
    target_member_id: governance-requirement.body.header.id

  - id: governance-requirement.model.header.title
    kind: mirrored_value
    source_member_id: governance-requirement.registry.record.title
    target_member_id: governance-requirement.body.header.title

  - id: governance-requirement.model.macro-requirement
    kind: composite_identity_relation
    source_member_id: governance-requirement.registry.record.macro-requirement-id
    owner_model_id: macro-requirement

  - id: governance-requirement.model.decision
    kind: composite_identity_relation
    source_member_id: governance-requirement.registry.record.decision-id
    owner_model_id: decision

  - id: governance-requirement.model.parent
    kind: required_parent_relation
    source_member_id: governance-requirement.registry.record.parent-requirement-id
    parent_model_id: functional-requirement
    same_macro_requirement: true
    same_decision: true
    identity_prefix_required: true

  - id: governance-requirement.model.body-path
    kind: derived_path
    source_member_id: governance-requirement.registry.record.body-path
    target_profile_id: governance-requirement-body
